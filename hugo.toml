baseURL = "https://mlkleadhunters.com/"
title = "MLK Leadhunters"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
timeZone = "Europe/Paris"
disableKinds = ["taxonomy", "term"]

[params]
  email = "hello@mlkleadhunters.com"
  emailMain = "hello@mlkleadhunters.com"
  accent = "#2B4DFF"
  orange = "#EF571D"
  bookingUrl = "/contact/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.extensions.extras.mark]
    enable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-GB"
    weight = 1
    contentDir = "content/en"
    title = "MLK Leadhunters"
    [languages.en.params]
      email = "hello@mlkleadhunters.co.uk"
      tagline = "Cold email that fills your calendar."
      description = "Done-for-you B2B cold email: targeting, infrastructure, copy and replies, so qualified meetings land in your calendar."
    [[languages.en.menus.main]]
      name = "Services"
      pageRef = "/services"
      weight = 10
    [[languages.en.menus.main]]
      name = "Projects"
      pageRef = "/projects"
      weight = 20
    [[languages.en.menus.main]]
      name = "Offers"
      pageRef = "/offers"
      weight = 30
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 40
    [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 50

  [languages.fr]
    languageName = "Français"
    languageCode = "fr-FR"
    weight = 2
    contentDir = "content/fr"
    title = "MLK Leadhunters"
    [languages.fr.params]
      email = "hello@mlkleadhunters.fr"
      formEmail = "contact@mlkleadhunters.fr"
      tagline = "Le cold email qui remplit votre agenda."
      description = "Cold email B2B clé en main : ciblage, infrastructure, rédaction et réponses, pour des rendez-vous qualifiés dans votre agenda."
    [[languages.fr.menus.main]]
      name = "Services"
      pageRef = "/services"
      weight = 10
    [[languages.fr.menus.main]]
      name = "Projets"
      pageRef = "/projects"
      weight = 20
    [[languages.fr.menus.main]]
      name = "Formules"
      pageRef = "/offers"
      weight = 30
    [[languages.fr.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 40
    [[languages.fr.menus.main]]
      name = "À propos"
      pageRef = "/about"
      weight = 50

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "static/images"
    target = "assets/images"

[related]
  includeNewer = true
  threshold = 40
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10
